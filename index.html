
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Collaboration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
        }

        .container {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .left {
            width: 50%;
            padding: 40px;
            background-color: white;
        }

        .right {
            width: 50%;
            padding: 40px;
            background-color: white;
        }

        .divider {
            width: 2px;
            background-color: #cbd5e1;
        }

        h2 {
            color: #1e293b;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .left, .right {
                width: 100%;
                min-height: 50vh;
            }

            .divider {
                width: 100%;
                height: 2px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- BAGIAN PEMILIK -->
        <div class="left">
            <h2>Pemilik</h2>

            <!-- Silakan kembangkan bagian ini -->

        </div>

        <!-- PEMBATAS TENGAH -->
        <div class="divider"></div>

        <!-- BAGIAN TAMU -->
        <div class="right">
            <h2>Tamu</h2>

            <!-- Silakan kembangkan bagian ini -->

        </div>

    </div>

</body>
</html>
