
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Collaboration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
        }

        .container {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .left,
        .right {
            flex: 1;
            min-width: 0;
            padding: 40px;
            background-color: white;
        }

        .right {
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .divider {
            width: 2px;
            flex-shrink: 0;
            background-color: #cbd5e1;
        }

        h2 {
            color: #1e293b;
            text-align: center;
        }

        .image-container {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tamu-image {
            width: 260px;
            max-width: 85%;
            height: auto;
            border-radius: 20px;
            animation: melayang 3s ease-in-out infinite;
        }

        @keyframes melayang {
            0%, 100% {
                transform: translateY(0) rotate(-3deg);
            }

            50% {
                transform: translateY(-20px) rotate(3deg);
            }
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .left,
            .right {
                flex: none;
                width: 100%;
                height: 50vh;
                padding: 25px;
            }

            .divider {
                width: 100%;
                height: 2px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .tamu-image {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- BAGIAN PEMILIK -->
        <div class="left">
            <h2>Pemilik</h2>

            <!-- Silakan kembangkan bagian ini -->
        </div>

        <!-- GARIS PEMBATAS -->
        <div class="divider"></div>

        <!-- BAGIAN TAMU -->
        <div class="right">
            <h2>Tamu</h2>

            <div class="image-container">
                <img
                    src="pp.jpeg"
                    alt="Karakter Tamu"
                    class="tamu-image"
                >
            </div>
        </div>

    </div>

</body>
</html>
