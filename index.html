
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Collaboration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
        }

        .container {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .left,
        .right {
            flex: 1;
            min-width: 0;
            padding: 40px;
            background: linear-gradient(135deg, #e0f2fe, #f8fafc);
        }

        .right {
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .divider {
            width: 2px;
            flex-shrink: 0;
            background-color: #cbd5e1;
        }

        h2 {
            color: #1e293b;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .left,
            .right {
                flex: none;
                width: 100%;
                min-height: 50vh;
            }

            .divider {
                width: 100%;
                height: 2px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .tamu-image {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- BAGIAN PEMILIK -->
        <div class="left">

            <h2 class="owner-title">Pemilik</h2>

            <!-- Silakan kembangkan bagian ini -->

        </div>

        <!-- GARIS PEMBATAS -->
        <div class="divider"></div>

        <!-- BAGIAN TAMU -->
        <div class="right">

            <h2>Tamu</h2>

            <!-- Silakan kembangkan bagian ini -->

        </div>

    </div>

</body>
</html>
